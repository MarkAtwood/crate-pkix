[package]
name        = "pkix-mta-sts-http"
description = "MTA-STS (RFC 8461) policy fetching over HTTPS: §3.3 rules enforced, non-public destinations refused"
version     = "0.1.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
keywords    = ["smtp", "mta-sts", "email", "https", "pki"]
categories  = ["cryptography", "network-programming"]
readme      = "README.md"

[features]
default = ["client-ureq"]

# Synchronous fetching via `ureq`.
client-ureq = ["dep:ureq", "dep:rustls", "pkix-net-guard/ureq"]

# Asynchronous fetching via `reqwest`.
client-reqwest = ["dep:reqwest", "dep:tokio", "dep:rustls", "pkix-net-guard/reqwest"]

[dependencies]
pkix-mta-sts   = { workspace = true }
# §3.3 fetches from `mta-sts.<recipient-domain>`, a host derived from data the
# sender did not choose. The destination policy is shared with pkix-aia-http
# rather than restated: a second copy of address classification whose job is
# refusing a request would be a divergence hazard.
pkix-net-guard = { workspace = true }

# Recognising a certificate-validation failure by downcasting to
# rustls::Error, rather than matching on an error message. Both backends use
# rustls, so this adds nothing to the dependency tree.
rustls  = { version = "0.23", default-features = false, optional = true }
ureq    = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio   = { version = "1", default-features = false, features = ["net"], optional = true }

[dev-dependencies]
# InMemoryPolicyStore, to test fetch_and_record without storage.
pkix-mta-sts = { workspace = true, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "net"] }
pkix-mta-sts-resolver = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
