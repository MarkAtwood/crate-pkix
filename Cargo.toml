[workspace]
resolver = "2"
members = [
    "pkix-path",
    "pkix-revocation",
    "pkix-chain",
    "pkix-chain-simple",
    "pkix-path-builder",
    "pkix-revocation-http",
    "pkix-profiles",
    "pkix-lint",
    "pkix-ct",
    "pkix-composite",
    "pkix-ac",
]

[workspace.package]
# Most workspace crates are at 0.2.1 (additive: cert_is_ca helper, PathBuilderConfig,
# stub-crate hygiene, idiom polish). Three crates with breaking changes pin their
# version explicitly: pkix-revocation 0.3.0 (Error::OutOfScope variant changes
# Ok(()) → Err(OutOfScope(_)) at 6 IDP scope-mismatch sites), pkix-chain 0.3.0
# (re-exports pkix-revocation::Error), pkix-chain-simple 0.3.0 (re-exports
# pkix-chain). pkix-lint at 0.2.0 (first publish). Stubs at 0.0.0 (not published).
version      = "0.2.1"
edition      = "2021"
rust-version = "1.73"
license      = "Apache-2.0 OR MIT"
repository   = "https://github.com/MarkAtwood/crate-pkix"
authors      = ["Mark Atwood <mark@reviewcommit.com>"]

[workspace.dependencies]
# Internal crates
pkix-path             = { path = "pkix-path",             version = "0.2.1" }
pkix-revocation       = { path = "pkix-revocation",       version = "0.3.0" }
pkix-path-builder     = { path = "pkix-path-builder",     version = "0.2.1" }
pkix-revocation-http  = { path = "pkix-revocation-http",  version = "0.0.0" }
pkix-profiles         = { path = "pkix-profiles",         version = "0.2.1" }
pkix-lint             = { path = "pkix-lint",             version = "0.2.0" }
pkix-ct               = { path = "pkix-ct",               version = "0.0.0" }
pkix-composite        = { path = "pkix-composite",        version = "0.0.0" }
pkix-ac               = { path = "pkix-ac",               version = "0.0.0" }

# RustCrypto core
der       = "0.7"
spki      = "0.7"
x509-cert = "0.2"
signature = "2"

# Algorithm backends (feature-gated in pkix-path)
p256           = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8"] }
rsa            = { version = "0.9",  default-features = false }
sha1           = { version = "0.10", default-features = false, features = ["oid"] }
sha2           = { version = "0.10", default-features = false, features = ["oid"] }

# Revocation (pkix-revocation)
x509-ocsp = "0.2"

# Serialization (used by pkix-lint serde feature)
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
