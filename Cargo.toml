[workspace]
resolver = "2"
members = [
    "pkix-path",
    "pkix-revocation",
    "pkix-chain",
    "pkix-chain-simple",
    "pkix-path-builder",
    "pkix-revocation-http",
    "pkix-profiles",
    "pkix-ct",
    "pkix-composite",
    "pkix-ac",
]

[workspace.package]
version      = "0.1.1"
edition      = "2021"
rust-version = "1.73"
license      = "Apache-2.0 OR MIT"
repository   = "https://github.com/MarkAtwood/crate-pkix"
authors      = ["Mark Atwood <mark@reviewcommit.com>"]

[workspace.dependencies]
# Internal crates
pkix-path             = { path = "pkix-path",             version = "0.1.1" }
pkix-revocation       = { path = "pkix-revocation",       version = "0.1.1" }
pkix-path-builder     = { path = "pkix-path-builder",     version = "0.1.1" }
pkix-revocation-http  = { path = "pkix-revocation-http",  version = "0.1.1" }
pkix-profiles         = { path = "pkix-profiles",         version = "0.1.1" }
pkix-ct               = { path = "pkix-ct",               version = "0.1.1" }
pkix-composite        = { path = "pkix-composite",        version = "0.1.1" }
pkix-ac               = { path = "pkix-ac",               version = "0.1.1" }

# RustCrypto core
der       = "0.7"
spki      = "0.7"
x509-cert = "0.2"
signature = "2"

# Algorithm backends (feature-gated in pkix-path)
p256           = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8"] }
p384           = { version = "0.13", default-features = false, features = ["ecdsa"] }
rsa            = { version = "0.9",  default-features = false }
sha1           = { version = "0.10", default-features = false, features = ["oid"] }
sha2           = { version = "0.10", default-features = false, features = ["oid"] }
ed25519-dalek  = { version = "2",    default-features = false }

# Revocation (pkix-revocation)
x509-ocsp = "0.2"
