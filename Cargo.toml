[workspace]
resolver = "2"
members = [
    "pkix-path",
    "pkix-revocation",
    "pkix-chain",
    "pkix-chain-simple",
    "pkix-path-builder",
    "pkix-revocation-http",
    "pkix-profiles",
    "pkix-profiles-cabf",
    "pkix-lint",
    "pkix-lint-cabf",
    "pkix-ct",
    "pkix-composite",
    "pkix-ac",
    "pkix-identity",
    "pkix-difftest",
    "pkix-truststore",
    "pkix-truststore-system",
    "pkix-truststore-pkcs11",
]

[workspace.package]
# Most workspace crates are at 0.2.1 (additive: cert_is_ca helper, PathBuilderConfig,
# stub-crate hygiene, idiom polish). Five crates with version overrides pin their
# version explicitly per the May-2026 0.3 follow-up release wave:
#   - pkix-path         0.3.0  BREAKING. ValidatedPath loses Copy/Hash; new owned-data
#                              fields for §6.1.5 wrap-up outputs and policy qualifiers.
#   - pkix-revocation   0.3.2  Additive. RevocationFetchFailed variant on Error
#                              (#[non_exhaustive]) for pkix-revocation-http
#                              network-fetcher adapters. Earlier 0.3.1 added
#                              CrlIdpDistributionPointMismatch on OutOfScopeReason.
#   - pkix-chain        0.4.0  TRANSITIVELY BREAKING. Re-exports pkix-path::ValidatedPath
#                              which lost Copy/Hash in 0.3.0; downstream cargo update
#                              must explicitly bump to 0.4.
#   - pkix-chain-simple 0.4.0  TRANSITIVELY BREAKING. Same rationale as pkix-chain 0.4.
#   - pkix-path-builder 0.3.0  BREAKING. Dep major bump on pkix-path; skip-not-fail
#                              behavior change for malformed BasicConstraints
#                              candidates (PKIX-qgw1, no longer aborts the search).
#   - pkix-profiles     0.3.0  BREAKING. CA/B Forum content (WebPkiProfile, SmimeProfile,
#                              CodeSigningProfile, sc081_validity_cap, CABF_*_ALLOWED_ALGS)
#                              moved to pkix-profiles-cabf. Deprecated re-exports remain
#                              in pkix-profiles for one release; drop in 0.4.0. New
#                              BasicTlsProfile (RFC 5280 + RFC 6125 + serverAuth EKU)
#                              and BasicSmimeProfile (RFC 8551 §3 baseline). PKIX-amgn.4.
#   - pkix-profiles-cabf 0.2.0 First substantive content release. Houses the CA/B Forum
#                              profiles moved out of pkix-profiles 0.3.0. PKIX-amgn.4.
#   - pkix-lint        0.8.0  ADDITIVE. `Severity` enum gains a `Notice`
#                              variant slotted between `Info` and `Warn`
#                              to align with the zlint catalog ranking
#                              (`pass < notice < warn < error < fatal`)
#                              and syslog RFC 5424 §6.2.1. Used by the
#                              planned `pkix-zlint-bridge` adapter to map
#                              zlint notice-level checks into the workspace
#                              severity model (PKIX-jy95.2.1).
#                              0.7.0: New public modules `rfc6125`,
#                              `rfc8398`, `rfc8551` plus two additions to
#                              `rfc5280` ship five RFC-conformance shape-check
#                              lints used by `BasicTlsProfile` /
#                              `BasicSmimeProfile` (PKIX-9vnx.9.2.1, partial).
#                              0.6.0: Lint trait gained `spec_section_id` and
#                              `spec_url`; `rfc_section_id` and `rfc_url`
#                              became #[deprecated] aliases retained for one
#                              minor version to ease migration (PKIX-ncab.11).
#                              0.5.0 (earlier May 2026) was BREAKING: CA/B
#                              Forum lint bundles (`cabf_tls_br`) moved to
#                              pkix-lint-cabf 0.2.0. pkix-lint keeps the
#                              framework (Lint trait, LintRunner, Finding,
#                              EvaluationReport, DeviationStore) plus
#                              RFC-conformance lints (`rfc5280` module).
#                              PKIX-amgn.5.
#   - pkix-lint-cabf   0.2.0  First substantive content release. Houses the
#                              `cabf_tls_br` module migrated from pkix-lint 0.5.0:
#                              `CabfTlsBrProfile`, `ValidityMaxLint`,
#                              `Sha1ProhibitedLint`, `RsaMinKeySizeLint`,
#                              `SanRequiredLint`, `EkuServerAuthLint`,
#                              `BcCaFlagLint`, `all_lints()`. PKIX-amgn.5.
# Earlier pkix-lint at 0.4.0 (DeviationScope kind+props refactor; PKIX-9vnx.11)
# and 0.3.0 (Cow<'static, str> migration; PKIX-ua6q). Implementation stubs at 0.0.0
# (not published). Namespace-reservation stubs at 0.1.0:
# pkix-truststore-system, pkix-truststore-pkcs11 — published to crates.io with
# "not authoritative" / "stub" rustdoc to claim the namespace before real impl lands.
version      = "0.2.1"
edition      = "2021"
rust-version = "1.73"
license      = "Apache-2.0 OR MIT"
repository   = "https://github.com/MarkAtwood/crate-pkix"
authors      = ["Mark Atwood <mark@reviewcommit.com>"]

[workspace.dependencies]
# Internal crates
pkix-path             = { path = "pkix-path",             version = "0.3.0" }
pkix-revocation       = { path = "pkix-revocation",       version = "0.3.2" }
pkix-path-builder     = { path = "pkix-path-builder",     version = "0.3.1" }
pkix-revocation-http  = { path = "pkix-revocation-http",  version = "0.0.0" }
pkix-profiles         = { path = "pkix-profiles",         version = "0.3.0" }
pkix-lint             = { path = "pkix-lint",             version = "0.8.0" }
pkix-ct               = { path = "pkix-ct",               version = "0.0.0" }
pkix-composite        = { path = "pkix-composite",        version = "0.0.0" }
pkix-ac               = { path = "pkix-ac",               version = "0.0.0" }
pkix-identity         = { path = "pkix-identity",         version = "0.1.0" }
pkix-truststore       = { path = "pkix-truststore",       version = "0.0.0" }
# Namespace-reservation stubs (published at 0.1.0; real impl per the linked beads):
pkix-profiles-cabf      = { path = "pkix-profiles-cabf",      version = "0.2.0" }
pkix-lint-cabf          = { path = "pkix-lint-cabf",          version = "0.2.0" }
pkix-truststore-system  = { path = "pkix-truststore-system",  version = "0.1.0" }
pkix-truststore-pkcs11  = { path = "pkix-truststore-pkcs11",  version = "0.1.0" }

# RustCrypto core
der       = "0.7"
spki      = "0.7"
x509-cert = "0.2"
signature = "2"

# Algorithm backends (feature-gated in pkix-path)
p256           = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8"] }
p384           = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8"] }
rsa            = { version = "0.9",  default-features = false }
sha1           = { version = "0.10", default-features = false, features = ["oid"] }
sha2           = { version = "0.10", default-features = false, features = ["oid"] }

# Revocation (pkix-revocation)
x509-ocsp = "0.2"

# IDN A-label / U-label conversion (pkix-identity).
# default-features = false keeps idna no_std; `compiled_data` ships the
# Unicode tables required for the lookup API; `alloc` enables the actual
# conversion API. Adding `std` is the crate-feature opt-in by consumers
# that want `std::error::Error`-shaped errors.
idna = { version = "1", default-features = false, features = ["alloc", "compiled_data"] }

# HTTP client backends for pkix-revocation-http reference impls. Pinned
# at workspace level so the sync (ureq) and async (reqwest) backends stay
# in lockstep across the workspace. default-features = false avoids
# pulling cookies / brotli / charset crates we do not need for OCSP / CRL
# transport; rustls is enabled for HTTPS responders.
ureq    = { version = "3",    default-features = false, features = ["rustls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# Async trait macro for the AsyncRevocationFetcher / AsyncRevocationChecker
# traits in pkix-revocation-http. Stable-channel MSRV trivially fits within
# the workspace's 1.73 floor; pinned at the workspace level so the
# crate-local feature flag does not drift from the version used by tests.
# Tokio is intentionally NOT a workspace dep — it is a dev-only dep of
# pkix-revocation-http's async integration tests, and a transitive runtime
# requirement of `reqwest`'s async client (the consumer brings their own
# runtime). Hoisting tokio to the workspace would force every member crate
# to think about an async runtime they do not use.
async-trait = "0.1"

# Serialization (used by pkix-lint serde feature)
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
