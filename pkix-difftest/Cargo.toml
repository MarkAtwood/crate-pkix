[package]
name        = "pkix-difftest"
description = "Differential test harness for pkix-path vs OpenSSL and pyca/cryptography (dev tooling, not for publication)"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
publish     = false
# pkix-difftest is dev tooling. It is not published to crates.io and must never be
# pulled in by a downstream library — it depends on `std`, spawns subprocesses,
# and intentionally pulls in heavy CLI / process / Python-bridge dependencies that
# violate the no_std posture of pkix-path. Marking publish = false makes that
# explicit and prevents accidental release tagging.

# This crate is the implementation of PKIX-7nsf. See the parent bead for scope.

[lib]
name = "pkix_difftest"
path = "src/lib.rs"

[[bin]]
name = "pkix-difftest"
path = "src/main.rs"

[features]
# Default: build pkix-path with its own default features ("rsa", "p256"). This
# answers "what does an unsuspecting downstream consumer get?" and is the
# primary baseline corpus (baseline-pkits.* / baseline-limbo.*).
default = []

# Secondary baseline: activate every signature backend pkix-path ships
# (pkix-path/rustcrypto = rsa + p256 + p384). Used to produce
# baseline-limbo-allfeatures.{json,md} per PKIX-wmch — the "with full crypto"
# delta that exercises real-world ECDSA P-384 chains (Apple, Cloudflare,
# Akamai, StackOverflow roots) and webpki:: P-384 testcases.
#
# Ed25519 is intentionally NOT in this list: pkix-path does not yet implement
# an Ed25519 SignatureVerifier (the rustcrypto umbrella feature is rsa + p256
# + p384 only). Cases requiring Ed25519 will continue to fail signature
# verification under this feature; that delta is documented in
# baseline-limbo-analysis.md.
rustcrypto = ["pkix-path/rustcrypto"]

# Lint-domain differential oracles (PKIX-hbzo.1.1). Pulls in `pkix-zlint-bridge`
# (subprocess to zlint) and `pkix-lint-cabf` (in-process reference CA/B Forum
# TLS BR lints), plus `pkix-lint` directly so the harness can name the shared
# `Severity` type in its NormalizedFinding vocabulary. Off by default so the
# baseline path-validation oracle CI does not pay for an unused subprocess
# dep tree.
lint-oracles = [
    "dep:pkix-zlint-bridge",
    "dep:pkix-lint",
    "dep:pkix-lint-cabf",
    "dep:pkix-profiles-cabf",
]

[dependencies]
# Core path validation under test. Default features ("rsa", "p256") give us
# DefaultVerifier — exactly what an unsuspecting downstream consumer would get.
# That is the right thing to test, since this harness is asking the question
# "what does the default pkix-path build do?"
#
# The harness itself can be built with --features rustcrypto to activate
# pkix-path's full set of signature backends (adds p384). That secondary
# build is what produces baseline-limbo-allfeatures.{json,md} per PKIX-wmch.
pkix-path = { workspace = true }

# Path building (PKIX-t0w4). Used by the PKITS loader to reorder CertPath
# bundles into actual signature chains — PKITS §4.4 / §4.14 / some §4.5 tests
# advertise CRL-signing certs in CertPath that are not in the signature chain.
# Without this, pkix-path's positional walk rejects the bundle as having
# signature mismatch; OpenSSL builds its own path internally.
#
# pkix-path-builder is no_std-by-default; we only need its core types so the
# default feature set is sufficient. Activating its `std` feature would expose
# a pre-existing `extern crate` lint in the upstream test module, unrelated
# to our work and out of scope here.
pkix-path-builder = { workspace = true }

# Revocation checking under test (PKIX-emf1.2). The pkix-path oracle wraps
# validate_path's verdict with an optional pass through CrlChecker when the
# chain ships with CRLs. Default features pull in the `crl` feature.
pkix-revocation = { workspace = true, features = ["crl"] }

# Cert parsing. pkix-path's `Certificate` is x509_cert::Certificate, not re-exported.
x509-cert = { workspace = true }
der       = { workspace = true }

# Multi-block PEM decoding. Already transitive via x509-cert; declared explicitly
# here because we use `decode_vec` directly in the chain loader.
pem-rfc7468 = "0.7"

# CLI. Greenfield in this workspace — no existing crate uses clap, but every
# RustCrypto dev-tool binary uses clap 4 derive. MSRV 1.73 covers it.
clap = { version = "4", features = ["derive"] }

# Tempdir for OpenSSL oracle (one-call temp files written to disk because
# `openssl verify` reads its CA / intermediates / leaf from filesystem paths,
# not stdin). MSRV-clean.
tempfile = "3"

# JSON deserialisation for PKITS vectors.json (the canonical NIST test vector
# manifest). Both crates are workspace-pinned via the [workspace.dependencies]
# table; we just bring them in here.
serde      = { workspace = true }
serde_json = { workspace = true }

# Optional lint-domain oracle dependencies. Activated only when the
# `lint-oracles` cargo feature is on. See the feature definition above for
# the architectural context (PKIX-hbzo.1.1).
pkix-zlint-bridge  = { workspace = true, optional = true }
pkix-lint          = { workspace = true, optional = true }
pkix-lint-cabf     = { workspace = true, optional = true }
# pkix-profiles-cabf provides WebPkiProfile, which carries the LintProfile impl
# bundling the six CA/B Forum TLS BR lints from pkix-lint-cabf. The lint oracle
# consumes the profile rather than reaching for the Lint types directly.
pkix-profiles-cabf = { workspace = true, optional = true }

[dev-dependencies]
# Wrapper-level differential test (`tests/verify_wrapper_pyca.rs`, PKIX-fmtv.19)
# drives `pkix_chain::verify_tls_server` and `verify_tls_client_dns` against
# the pyca/cryptography `PolicyBuilder` sidecar over the curated RFC 6125
# corpus in `pkix-chain/tests/fixtures/`. pkix-chain is a dev-dep only —
# pkix-difftest's runtime crate has no reason to pull in the high-level
# umbrella.
pkix-chain    = { workspace = true }
pkix-profiles = { workspace = true }
pkix-identity = { workspace = true }
