[package]
name        = "pkix-lint"
version           = "0.4.0"  # 0.4 — DeviationScope refactor to open-ended kind + props bag (PKIX-9vnx.11). 0.3 — Cow<'static, str> migration + Finding.cert_sha256 (PKIX-ua6q, PKIX-a86q).
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Lint engine for X.509 certificates — structured soft-fail and advisory results"
keywords    = ["x509", "certificate", "pki", "lint", "cabforum"]
categories  = ["cryptography"]

[features]
# Enable serde Serialize/Deserialize on Finding, DeviatedFinding, and EvaluationReport.
# Off by default so the core engine stays dep-light for embedded / constrained targets.
serde = ["dep:serde"]
# Enable the `oscal` module: emit OSCAL Assessment Results JSON from an
# `EvaluationReport`. Pulls in `serde_json` as a real dependency. Architecture 2
# (PKIX-ztmr): the emitter projects pkix-lint's internal types into OSCAL JSON
# at serialization time; internal Rust types remain lean and lint-tailored.
oscal = ["dep:serde_json"]

[dependencies]
pkix-path          = { workspace = true }
# CA/B Forum profile definitions live in pkix-profiles-cabf; pkix-lint's
# cabf_tls_br module depends on WebPkiProfile and sc081_validity_cap from
# that crate. (Pre-0.3.0 these symbols lived in pkix-profiles; they were
# moved as part of PKIX-amgn.4 to enforce the framework-not-policy stance.)
pkix-profiles-cabf = { workspace = true }
x509-cert     = { workspace = true }
der           = { workspace = true }
serde         = { workspace = true, optional = true }
serde_json    = { workspace = true, optional = true }
# SHA-256 for Finding.cert_sha256 (PKIX-a86q) and for deterministic OSCAL
# UUIDs (RFC 9562 §5.8 v8) under the `oscal` feature. Already transitively
# pulled in by x509-cert; declaring it explicitly here so the dependency is
# visible and does not silently break if x509-cert's tree changes.
# `default-features = false` matches the workspace pin and keeps pkix-lint
# compatible with hypothetical downstream no_std forks even though pkix-lint
# itself uses std.
sha2          = { workspace = true }

[dev-dependencies]
pkix-path          = { workspace = true, features = ["p256", "std"] }
pkix-profiles-cabf = { workspace = true }
der           = { workspace = true }
x509-cert     = { workspace = true }
# serde_json is used by the json_round_trip test which requires --features serde.
# Run with: cargo test -p pkix-lint --features serde
serde_json    = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
