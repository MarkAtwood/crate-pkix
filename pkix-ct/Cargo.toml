[package]
name        = "pkix-ct"
description = "Certificate Transparency SCT verification for pkix-chain (RFC 6962)"
version               = "0.1.0"
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
repository.workspace  = true
authors.workspace     = true
keywords    = ["x509", "certificate", "pki", "transparency", "rfc6962"]
categories  = ["cryptography"]

[features]
default = []

# Enable `std::error::Error` impl on the `Error` type. The crate's core
# parser is `no_std` + `alloc`; this feature gates only the std-only
# trait impl plus propagates the std feature to transitive deps so they
# can use std::io etc. when wired into a std-only consumer.
std = ["der/std", "x509-cert/std", "signature/std", "x509-ocsp?/std", "sha2?/std"]

# Enable the OCSP-response SCT extractor (`sct_list_from_ocsp_response`).
# Pulls in `x509-ocsp` for `BasicOcspResponse` parsing. Disabled by
# default so the core parser stays free of OCSP-specific deps.
ocsp = ["dep:x509-ocsp"]

# Enable the CT-log-list type (`CtLog`, `CtLogList`, log_id ↔ SPKI hash
# consistency check). Pulls in `sha2` for the consistency check. The
# core SCT-parser does not depend on this; consumers only need it to
# associate parsed SCTs back to trusted log keys.
log-list = ["dep:sha2"]

# Enable the Google/Chrome log_list.json schema parser
# (`CtLogList::from_google_log_list_json`). Pulls in `serde`,
# `serde_json`, and `base64` for the JSON shape. Implies `log-list`.
log-list-json = ["log-list", "dep:serde", "dep:serde_json", "dep:base64"]

[dependencies]
pkix-path = { workspace = true }
der        = { workspace = true }
x509-cert  = { workspace = true }
signature  = { workspace = true }
x509-ocsp  = { workspace = true, optional = true }
sha2       = { workspace = true, optional = true }
serde      = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
base64     = { version = "0.22", default-features = false, features = ["alloc"], optional = true }

[dev-dependencies]
# Integration tests load PEM/DER certs and walk extensions; x509-cert with
# `pem` enabled provides Certificate::from_pem. The crate itself does not
# depend on PEM parsing.
x509-cert = { workspace = true, features = ["pem", "std"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
