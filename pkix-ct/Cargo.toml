[package]
name        = "pkix-ct"
description = "Certificate Transparency SCT verification for pkix-chain (RFC 6962)"
version               = "0.0.0"
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
repository.workspace  = true
authors.workspace     = true
keywords    = ["x509", "certificate", "pki", "transparency", "rfc6962"]
categories  = ["cryptography", "no-std"]

[features]
default = []
std     = ["der/std", "x509-cert/std", "pkix-path/std"]

[dependencies]
pkix-path = { workspace = true }
der        = { workspace = true }
x509-cert  = { workspace = true }
signature  = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
