[package]
name        = "pkix-lint-cabf-refresh"
description = "Maintainer-only tool: transform `zlint -list-lints-json` output into a vendored OSCAL Catalog JSON for pkix-lint-cabf (not for publication)"
version     = "0.0.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
publish     = false
# pkix-lint-cabf-refresh is dev tooling owned by the workspace maintainer. It is
# not published to crates.io and is not pulled in by any library crate. It runs
# offline against a pre-captured `zlint -list-lints-json` output and writes a
# vendored OSCAL Catalog JSON consumed at runtime by pkix-lint-cabf. Marking
# publish = false makes that explicit and prevents accidental release tagging.
#
# Tracking: PKIX-amgn.8.2 (this skeleton). PKIX-amgn.8.3 lands the actual
# JSON→OSCAL transform; PKIX-amgn.8.4 vendors the first catalog output.

[[bin]]
name = "pkix-lint-cabf-refresh"
path = "src/main.rs"

[dependencies]
# OSCAL types are reused from pkix-lint's `oscal` module at compile time so the
# JSON-shape definitions live in exactly one place. PKIX-amgn.8.3 will pull the
# OSCAL Catalog types out of this dep when the transform is implemented; the
# skeleton stage simply takes the dep to lock the contract.
pkix-lint  = { workspace = true, features = ["oscal", "serde"] }

# CLI args. The same clap-4-derive pattern used by pkix-difftest. Kept as a
# crate-local dep (not hoisted to the workspace) because no library crate uses
# clap and pinning across two dev binaries does not warrant a workspace entry.
clap       = { version = "4", features = ["derive"] }

# JSON IO. Workspace-pinned serde + serde_json.
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
