[package]
name        = "pkix-revocation"
description = "Certificate revocation checking (CRL, OCSP) for pkix-path"
version.workspace     = true
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
repository.workspace  = true
authors.workspace     = true
keywords    = ["x509", "certificate", "crl", "ocsp", "pki"]
categories  = ["cryptography"]

[features]
default = []

# Enable std::error::Error impl on Error type
std = ["der/std"]

# Offline CRL validation (no network; you provide the DER-encoded CRL bytes)
crl  = []

# OCSP response validation (offline; you provide the DER-encoded response bytes)
ocsp = []

# TODO: async HTTP fetch traits (pulls in async deps — never enabled for no_std targets)
# fetch = ["dep:...", "crl", "ocsp"]

[dependencies]
pkix-path = { workspace = true }
der        = { workspace = true }
spki       = { workspace = true }
x509-cert  = { workspace = true }

# TODO: x509-ocsp = { workspace = true, optional = true }  # enable with ocsp feature

[dev-dependencies]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
