[package]
name        = "pkix-revocation"
description = "Certificate revocation checking (CRL, OCSP) for pkix-path"
version               = "0.3.0"  # BREAKING: Error::OutOfScope variant; see CHANGELOG.md
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
repository.workspace  = true
authors.workspace     = true
keywords    = ["x509", "certificate", "crl", "ocsp", "pki"]
categories  = ["cryptography"]

[features]
default = []

# Enable std::error::Error impl on Error type
std = ["der/std"]

# Offline CRL validation (no network; you provide the DER-encoded CRL bytes)
crl  = ["std"]

# OCSP response validation (offline; you provide the DER-encoded response bytes)
ocsp = ["std", "dep:x509-ocsp", "dep:sha1", "dep:sha2"]

[dependencies]
pkix-path = { workspace = true }
der        = { workspace = true }
spki       = { workspace = true }
x509-cert  = { workspace = true }
x509-ocsp  = { workspace = true, optional = true }
sha1       = { workspace = true, optional = true }
sha2       = { workspace = true, optional = true }

[dev-dependencies]
der       = { workspace = true }
x509-cert = { workspace = true }
pkix-path = { workspace = true, features = ["rsa", "p256", "std"] }

[[test]]
name = "crl_checker_tests"
required-features = ["crl"]

[[test]]
name = "ocsp_checker_tests"
required-features = ["ocsp"]

[[test]]
name = "pkits_crl"
required-features = ["crl"]

[[test]]
name = "pkits_4_5"
required-features = ["crl"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
