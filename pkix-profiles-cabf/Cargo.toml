[package]
name        = "pkix-profiles-cabf"
description = "Reference implementation of CA/Browser Forum certificate profile requirements (TLS BR, S/MIME BR, Code Signing BR) — not authoritative"
version     = "0.1.0"
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
repository.workspace  = true
authors.workspace     = true
keywords    = ["x509", "certificate", "pki", "cabforum", "tls"]
categories  = ["cryptography"]

[dependencies]
der           = { workspace = true }
pkix-path     = { workspace = true }
pkix-profiles = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
