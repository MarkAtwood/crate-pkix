[package]
name        = "pkix-profiles-cabf"
description = "Reference implementation of CA/Browser Forum certificate profile requirements (TLS BR, S/MIME BR, Code Signing BR) — not authoritative"
version     = "0.2.0"
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
repository.workspace  = true
authors.workspace     = true
keywords    = ["x509", "certificate", "pki", "cabforum", "tls"]
categories  = ["cryptography"]

[dependencies]
der           = { workspace = true }
# Default features (rsa, p256) are intentionally enabled: pkix-profiles-cabf tests
# use EcdsaP256Verifier and the workspace pin already enables them.
pkix-path     = { workspace = true }
# pkix-lint provides the LintProfile trait that Profile types implement
# alongside Profile to expose their canonical lint set (PKIX-9vnx.9.2).
pkix-lint     = { workspace = true }
# pkix-lint-cabf supplies the CA/B Forum TLS BR Lint impls that
# WebPkiProfile's LintProfile impl bundles (PKIX-9vnx.9.2.2).
pkix-lint-cabf = { workspace = true }
# x509-cert's `Certificate` is the per-cert input type for the shape-check
# convenience aliases (`check_web_pki_shape`, `check_smime_shape`,
# `check_code_signing_shape`). Already a transitive dep via pkix-path;
# declared directly so the alias signatures can name `x509_cert::Certificate`
# without leaning on a re-export.
x509-cert     = { workspace = true }

[dev-dependencies]
# x509-cert is already a regular dep; integration tests use it via that
# edge. No separate dev-dep declaration needed.

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
