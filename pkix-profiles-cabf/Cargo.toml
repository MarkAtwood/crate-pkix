[package]
name        = "pkix-profiles-cabf"
description = "Reference implementation of CA/Browser Forum certificate profile requirements (TLS BR, S/MIME BR, Code Signing BR) — not authoritative"
version     = "0.2.0"
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
repository.workspace  = true
authors.workspace     = true
keywords    = ["x509", "certificate", "pki", "cabforum", "tls"]
categories  = ["cryptography"]

[dependencies]
der           = { workspace = true }
# Default features (rsa, p256) are intentionally enabled: pkix-profiles-cabf tests
# use EcdsaP256Verifier and the workspace pin already enables them.
pkix-path     = { workspace = true }

[dev-dependencies]
x509-cert = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
