[package]
name        = "pkix-revocation-http"
description = "Online CRL and OCSP fetching for pkix-revocation"
version               = "0.1.0"
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
repository.workspace  = true
authors.workspace     = true
keywords    = ["x509", "certificate", "crl", "ocsp", "revocation"]
categories  = ["cryptography"]

[features]
default = []
crl  = ["pkix-revocation/crl"]
ocsp = [
    "pkix-revocation/ocsp",
    "dep:x509-ocsp",
    "dep:sha1",
    "dep:sha2",
]
# Reference HTTP transport using ureq (PKIX-a1yc.8). Optional; enabling
# this feature pulls in rustls for HTTPS support.
client-ureq = ["dep:ureq"]

# Async fetcher trait + reference reqwest async backend (PKIX-a1yc.10).
# `async` enables only the AsyncRevocationFetcher / AsyncRevocationChecker
# traits and the AsyncHttpCrlFetcher / AsyncHttpOcspFetcher wrappers
# (consumer brings their own reqwest / hyper / etc. impl of the trait).
# `client-reqwest-async` additionally pulls in the reference reqwest
# implementation. Consumers driving these futures must bring their own
# async runtime (tokio, async-std); the crate does not.
async                = ["dep:async-trait"]
client-reqwest-async = ["async", "dep:reqwest"]

[dependencies]
pkix-path       = { workspace = true }
pkix-revocation = { workspace = true }
der             = { workspace = true }
x509-cert       = { workspace = true }

# OCSP request building (PKIX-a1yc.4). Pulled in only when the `ocsp`
# feature is enabled. x509-ocsp's `builder` sub-feature gives us
# Request::from_cert::<D>(...), and sha1 / sha2 supply the Digest impls
# whose AssociatedOid the builder consumes for the CertID hashAlgorithm.
x509-ocsp = { workspace = true, optional = true, features = ["builder"] }
sha1      = { workspace = true, optional = true }
sha2      = { workspace = true, optional = true }

# Reference HTTP client (PKIX-a1yc.8). See `clients::ureq` module.
ureq = { workspace = true, optional = true }

# Async trait machinery (PKIX-a1yc.10). Pulled in by the `async` feature.
# The trait macro generates code that boxes returned futures as
# `Pin<Box<dyn Future + Send + 'async_trait>>`; that allocation cost is
# accepted as the price of object-safe async traits at MSRV 1.73 (native
# `async fn` in traits is stable but is 1.75+).
async-trait = { workspace = true, optional = true }

# Reference async HTTP client (PKIX-a1yc.10). See `clients::reqwest`
# module. Pulled in only by the `client-reqwest-async` feature; the
# trait crate itself does not depend on reqwest.
reqwest = { workspace = true, optional = true }

[dev-dependencies]
# DefaultVerifier (rsa + p256 OID dispatch) is needed by the CrlChecker
# / OcspChecker delegation tests. std needed for std::error::Error.
pkix-path = { workspace = true, features = ["rsa", "p256", "std"] }
# Mock HTTP server for the integration-test suite (PKIX-a1yc.9). MSRV
# 1.70, comfortably within the workspace's 1.73 MSRV.
mockito = "1.7"

# Async runtime + async mock server, dev-only (PKIX-a1yc.10). Tokio is
# the universal async runtime for reqwest's async client; the integration
# tests drive futures via `#[tokio::test]`. wiremock provides a real
# tokio-hosted HTTP mock server (mockito is sync-only by design). Both
# are dev-deps, so they do not propagate to consumers of pkix-revocation-http.
tokio    = { version = "1", default-features = false, features = ["rt", "macros"] }
wiremock = "0.6"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
