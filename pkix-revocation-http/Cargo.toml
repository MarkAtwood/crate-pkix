[package]
name        = "pkix-revocation-http"
description = "Online CRL and OCSP fetching for pkix-revocation"
version.workspace     = true
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
repository.workspace  = true
authors.workspace     = true
keywords    = ["x509", "certificate", "crl", "ocsp", "revocation"]
categories  = ["cryptography"]

[features]
default = []
crl  = ["pkix-revocation/crl"]
ocsp = ["pkix-revocation/ocsp"]

[dependencies]
pkix-path       = { workspace = true, features = ["std"] }
pkix-revocation = { workspace = true, features = ["std"] }
der             = { workspace = true }
x509-cert       = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
