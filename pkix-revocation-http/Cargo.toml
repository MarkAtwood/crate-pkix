[package]
name        = "pkix-revocation-http"
description = "Online CRL and OCSP fetching for pkix-revocation"
version               = "0.0.0"
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
repository.workspace  = true
authors.workspace     = true
keywords    = ["x509", "certificate", "crl", "ocsp", "revocation"]
categories  = ["cryptography"]

[features]
default = []
crl  = ["pkix-revocation/crl"]
ocsp = [
    "pkix-revocation/ocsp",
    "dep:x509-ocsp",
    "dep:sha1",
    "dep:sha2",
]
# Reference HTTP transport using ureq (PKIX-a1yc.8). Optional; enabling
# this feature pulls in rustls for HTTPS support.
client-ureq = ["dep:ureq"]

[dependencies]
pkix-path       = { workspace = true }
pkix-revocation = { workspace = true }
der             = { workspace = true }
x509-cert       = { workspace = true }

# OCSP request building (PKIX-a1yc.4). Pulled in only when the `ocsp`
# feature is enabled. x509-ocsp's `builder` sub-feature gives us
# Request::from_cert::<D>(...), and sha1 / sha2 supply the Digest impls
# whose AssociatedOid the builder consumes for the CertID hashAlgorithm.
x509-ocsp = { workspace = true, optional = true, features = ["builder"] }
sha1      = { workspace = true, optional = true }
sha2      = { workspace = true, optional = true }

# Reference HTTP client (PKIX-a1yc.8). See `clients::ureq` module.
ureq = { workspace = true, optional = true }

[dev-dependencies]
# DefaultVerifier (rsa + p256 OID dispatch) is needed by the CrlChecker
# / OcspChecker delegation tests. std needed for std::error::Error.
pkix-path = { workspace = true, features = ["rsa", "p256", "std"] }
# Mock HTTP server for the integration-test suite (PKIX-a1yc.9). MSRV
# 1.70, comfortably within the workspace's 1.73 MSRV.
mockito = "1.7"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
