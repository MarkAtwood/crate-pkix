[package]
name        = "pkix-policy-zlint"
description = "Thin Lint adapter exposing zlint's per-check verdicts as pkix-lint Lints (via pkix-zlint-bridge)"
version     = "0.0.0"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
keywords    = ["x509", "certificate", "lint", "zlint", "compliance"]
categories  = ["cryptography"]

# Std-only by construction: pkix-zlint-bridge spawns subprocesses. No
# `no_std` story here.

[dependencies]
# Lint trait + Severity / Scope / SubjectKind / LintResult vocabulary.
pkix-lint = { workspace = true }

# Subprocess + per-cert verdict cache, plus the ZlintLintInfo metadata
# the adapter wraps.
pkix-zlint-bridge = { workspace = true }

# x509-cert::Certificate is the type Lint::check_cert / check_path
# receive from LintRunner. We re-encode to DER before handing bytes to
# the bridge.
x509-cert = { workspace = true }
der       = { workspace = true }

[dev-dependencies]
# Tests construct a ZlintBridge against the real zlint binary on PATH
# (auto-skipped if missing). The bridge already covers this pattern.
pkix-zlint-bridge = { workspace = true }
pkix-lint         = { workspace = true }
# pkix-path's p256+std features are enabled to satisfy the
# x509-cert::Certificate construction path used by some fixtures.
pkix-path         = { workspace = true, features = ["p256", "std"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
