[package]
name        = "pkix-profiles"
description = "CA/Browser Forum and RFC certificate profile policies for pkix-chain"
version.workspace     = true
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
repository.workspace  = true
authors.workspace     = true
keywords    = ["x509", "certificate", "pki", "cabforum", "tls"]
categories  = ["cryptography"]

[dependencies]
der       = { workspace = true }
# Default features (rsa, p256) are intentionally enabled: pkix-profiles tests use EcdsaP256Verifier.
pkix-path = { workspace = true }

[dev-dependencies]
x509-cert = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
