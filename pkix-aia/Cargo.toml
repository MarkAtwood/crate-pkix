[package]
name        = "pkix-aia"
description = "Authority Information Access (AIA) fetcher trait and types for pkix-chain (RFC 5280 §4.2.2.1)"
version               = "0.0.0"
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
repository.workspace  = true
authors.workspace     = true
keywords    = ["x509", "certificate", "aia", "pki", "rfc5280"]
categories  = ["cryptography", "no-std"]

[features]
default = []

# `std` enables `std::error::Error` impl on `AiaError` and unlocks the
# `AiaError::IoFailure` variant whose `kind: std::io::ErrorKind` field is
# only meaningful under `std`. Real network-fetching adapters
# (`pkix-aia-http`, future) require `std` anyway, so `no_std` callers
# (e.g. consumers of `NoAiaFetcher` that never construct a transport
# error) are unaffected.
std = []

# `serde` enables `Serialize`/`Deserialize` derives on `AiaError`.
# When combined with `std`, the `IoFailure` variant round-trips its
# `io::ErrorKind` field through a string label via a crate-private
# helper module (`std::io::ErrorKind` does not derive `Serialize`
# upstream). Per AGENTS.md non-negotiable #6, error types SHOULD
# support serde behind a feature flag so cross-process / persistent
# caches and prevalidation workflows can keep `AiaError` values.
serde = ["dep:serde"]

[dependencies]
# Optional serde derives. Activated only by the `serde` feature.
serde = { workspace = true, optional = true }

[dev-dependencies]
# Round-trip tests use serde_json as the human-readable JSON oracle.
serde_json = { workspace = true }

[[test]]
name              = "round_trip"
required-features = ["serde", "std"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
