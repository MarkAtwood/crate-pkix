[package]
name        = "pkix-path"
description = "RFC 5280 X.509 certificate path validation — pure Rust, no_std"
version               = "0.3.0"  # BREAKING: ValidatedPath loses Copy; see CHANGELOG.md
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
repository.workspace  = true
authors.workspace     = true
keywords    = ["x509", "certificate", "pki", "pkix", "no-std"]
categories  = ["cryptography", "no-std"]

[features]
default   = ["rsa", "p256"]

# Enable std::error::Error impl on Error type (no_std cores stay no_std without this).
# Propagate std to all workspace crates that gate behaviour behind it.
std = ["der/std", "spki/std", "x509-cert/std", "signature/std"]

# Enable serde::Serialize / serde::Deserialize on the load-bearing result
# types (ValidatedPath, ValidationPolicy, TrustAnchor, PolicyTreeNode,
# DnAttrRule, Error, DerError). Format-adaptive DER wire form per
# `serde_der`: base64 in human-readable serializers, raw bytes in binary
# serializers. See AGENTS.md non-negotiable #6 and PKIX-2l0v.1.
serde = ["dep:serde", "dep:base64ct"]

# RustCrypto algorithm backends — disable all to bring your own SignatureVerifier.
# Currently implemented: RSA-PKCS1v15-SHA-256, RSA-PKCS1v15-SHA-384,
# RSA-PKCS1v15-SHA-512, ECDSA-P-256-SHA-256, and ECDSA-P-384-SHA-384.
# Ed25519 (RFC 8032) and RSA-PSS (RFC 4055) remain future work; see project
# tracker (PKIX-gphz).
rustcrypto = ["rsa", "p256", "p384"]
rsa        = ["dep:rsa", "dep:sha2"]
p256       = ["dep:p256"]
p384       = ["dep:p384", "dep:sha2"]

[dependencies]
der       = { workspace = true }
spki      = { workspace = true }
x509-cert = { workspace = true }
signature = { workspace = true }

# Algorithm backends (optional)
p256 = { workspace = true, optional = true }
p384 = { workspace = true, optional = true }
rsa  = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

# Serde support (optional, gated behind the `serde` feature).
serde    = { workspace = true, optional = true }
base64ct = { workspace = true, optional = true }

[dev-dependencies]
# PKITS test vectors and external oracle results go here.
# serde_json is used by the `serde` round-trip tests; run with
# `cargo test -p pkix-path --features serde`.
serde      = { workspace = true }
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
