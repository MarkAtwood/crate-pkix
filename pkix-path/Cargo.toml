[package]
name        = "pkix-path"
description = "RFC 5280 X.509 certificate path validation — pure Rust, no_std"
version               = "0.3.2"  # Additive: P-384, RSA-SHA384/512 SignatureVerifiers; see CHANGELOG.md
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
repository.workspace  = true
authors.workspace     = true
keywords    = ["x509", "certificate", "pki", "pkix", "no-std"]
categories  = ["cryptography", "no-std"]

[features]
default   = ["rsa", "p256"]

# Enable std::error::Error impl on Error type (no_std cores stay no_std without this).
# Propagate std to all workspace crates that gate behaviour behind it.
std = ["der/std", "spki/std", "x509-cert/std"]

# Enable serde::Serialize / serde::Deserialize on the load-bearing result
# types (ValidatedPath, ValidationPolicy, TrustAnchor, PolicyTreeNode,
# DnAttrRule, Error, DerError). Format-adaptive DER wire form per
# `serde_der`: base64 in human-readable serializers, raw bytes in binary
# serializers. See AGENTS.md non-negotiable #6 and PKIX-2l0v.1.
serde = ["dep:serde", "dep:base64ct"]

# RustCrypto algorithm backends — disable all to bring your own SignatureVerifier.
# Implemented by `DefaultVerifier`:
#   rsa     RSA PKCS#1 v1.5 with SHA-256/384/512, RSASSA-PSS (RFC 4055) with
#           SHA-256/384/512 and MGF1 over the same hash
#   p256    ECDSA on P-256
#   p384    ECDSA on P-384
#   p521    ECDSA on P-521
#   ed25519 Ed25519 (RFC 8410)
# ECDSA curves are chosen from the issuer's SubjectPublicKeyInfo, and the
# digest from the signature algorithm (ecdsa-with-SHA256/384/512), so any
# enabled curve verifies with any of the three digests.
rustcrypto = ["rsa", "p256", "p384", "p521", "ed25519"]
rsa        = ["dep:rsa", "dep:sha2"]
p256       = ["dep:p256", "dep:sha2"]
p384       = ["dep:p384", "dep:sha2"]
p521       = ["dep:p521", "dep:sha2"]
ed25519    = ["dep:ed25519-dalek"]

[dependencies]
der       = { workspace = true }
spki      = { workspace = true }
x509-cert = { workspace = true }
signature = { workspace = true }

# Algorithm backends (optional)
p256 = { workspace = true, optional = true }
p384 = { workspace = true, optional = true }
p521 = { workspace = true, optional = true }
rsa  = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }

# Serde support (optional, gated behind the `serde` feature).
serde    = { workspace = true, optional = true }
base64ct = { workspace = true, optional = true }

[dev-dependencies]
# `derive` for the test-only certificate mirror in tests/support/raw_cert.rs.
der        = { workspace = true, features = ["derive"] }
# PKITS test vectors and external oracle results go here.
# serde_json is used by the `serde` round-trip tests; run with
# `cargo test -p pkix-path --features serde`.
serde      = { workspace = true }
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
