[package]
name        = "pkix-path"
description = "RFC 5280 X.509 certificate path validation — pure Rust, no_std"
version               = "0.4.6"
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
repository.workspace  = true
authors.workspace     = true
keywords    = ["x509", "certificate", "pki", "pkix", "no-std"]
categories  = ["cryptography", "no-std"]

[features]
# Every RustCrypto backend, on by default.
#
# The project stance is that ordinary modern algorithms should not be an
# opt-in: a plain dependency on this crate verifies RSA PKCS#1 v1.5,
# RSASSA-PSS, ECDSA P-256/P-384/P-521 and Ed25519. The default used to be
# ["rsa", "p256"], which meant a caller who did nothing got a verifier
# that rejected a P-384 chain as `unsupported_key` — correct behaviour,
# baffling default.
#
# Constrained environments are served by turning backends OFF rather than
# on: `default-features = false` plus whatever a regulator permits, or
# none at all to supply your own `SignatureVerifier`. An algorithm that is
# not compiled in returns `unsupported_algorithm` (or `unsupported_key`
# for a curve), distinct from `MalformedKey`, so a caller can tell "this
# build does not do that" from "that key is broken". Nothing panics and
# nothing silently succeeds.
#
# `rustcrypto` rather than the expanded list, so there is one place that
# says what the full set is.
#
# Bare metal: thumbv7em and riscv64 build with these defaults as they
# stand. x86_64-unknown-none additionally needs
#   RUSTFLAGS='--cfg sha2_backend="soft" --cfg curve25519_dalek_backend="serial"'
# because sha2 and curve25519-dalek both pick x86 SIMD backends that hit an
# LLVM error on that soft-float target. The sha2 half was already required
# before `ed25519` became default; curve25519-dalek is the new one.
default   = ["rustcrypto"]

# Enable std::error::Error impl on Error type (no_std cores stay no_std without this).
# Propagate std to all workspace crates that gate behaviour behind it.
std = ["der/std", "spki/std", "x509-cert/std"]

# Enable serde::Serialize / serde::Deserialize on the load-bearing result
# types (ValidatedPath, ValidationPolicy, TrustAnchor, PolicyTreeNode,
# DnAttrRule, Error, DerError). Format-adaptive DER wire form per
# `serde_der`: base64 in human-readable serializers, raw bytes in binary
# serializers. See AGENTS.md non-negotiable #6 and PKIX-2l0v.1.
serde = ["dep:serde", "dep:base64ct"]

# RustCrypto algorithm backends — disable all to bring your own SignatureVerifier.
# Implemented by `DefaultVerifier`:
#   rsa     RSA PKCS#1 v1.5 with SHA-256/384/512, RSASSA-PSS (RFC 4055) with
#           SHA-256/384/512 and MGF1 over the same hash
#   p256    ECDSA on P-256
#   p384    ECDSA on P-384
#   p521    ECDSA on P-521
#   ed25519 Ed25519 (RFC 8410)
# ECDSA curves are chosen from the issuer's SubjectPublicKeyInfo, and the
# digest from the signature algorithm (ecdsa-with-SHA256/384/512), so any
# enabled curve verifies with any of the three digests.
rustcrypto = ["rsa", "p256", "p384", "p521", "ed25519"]
rsa        = ["dep:rsa", "dep:sha2"]
p256       = ["dep:p256", "dep:sha2"]
p384       = ["dep:p384", "dep:sha2"]
p521       = ["dep:p521", "dep:sha2"]
ed25519    = ["dep:ed25519-dalek"]

# Legacy SHA-1 verification, for validating chains issued before SHA-1 was
# retired. Deliberately NOT in `rustcrypto` and not in `default`: that
# umbrella means "algorithms we recommend", and these are not recommended.
# Verification only — nothing here signs with SHA-1.
#
# Split in two because the populations differ. RSA-PKCS1v15+SHA-1 is
# everywhere in pre-2018 government PKI, federal bridge cross-certs and
# long-lived enterprise CAs; ECDSA+SHA-1 is real but rare. A consumer who
# needs the first should not be made to compile the second.
rsa-sha1   = ["rsa", "dep:sha1"]
ecdsa-sha1 = ["p256", "dep:sha1"]

[dependencies]
der       = { workspace = true }
spki      = { workspace = true }
x509-cert = { workspace = true }
signature = { workspace = true }

# Algorithm backends (optional)
p256 = { workspace = true, optional = true }
p384 = { workspace = true, optional = true }
p521 = { workspace = true, optional = true }
rsa  = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
sha1 = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }

# Serde support (optional, gated behind the `serde` feature).
serde    = { workspace = true, optional = true }
base64ct = { workspace = true, optional = true }

[dev-dependencies]
# `derive` for the test-only certificate mirror in tests/support/raw_cert.rs.
der        = { workspace = true, features = ["derive"] }
# PKITS test vectors and external oracle results go here.
# serde_json is used by the `serde` round-trip tests; run with
# `cargo test -p pkix-path --features serde`.
serde      = { workspace = true }
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
