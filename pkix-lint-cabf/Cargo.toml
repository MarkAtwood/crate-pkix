[package]
name        = "pkix-lint-cabf"
description = "Reference CA/Browser Forum lint bundles for pkix-lint (TLS BR, S/MIME BR) — not authoritative"
version               = "0.3.2"
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
repository.workspace  = true
authors.workspace     = true
keywords    = ["x509", "certificate", "cabforum", "lint", "compliance"]
categories  = ["cryptography"]

[dependencies]
# pkix-lint: framework (Lint trait, LintRunner, LintResult, ...).
pkix-lint          = { workspace = true }
x509-cert          = { workspace = true }
der                = { workspace = true }

[dev-dependencies]
# pkix-path's p256 + std features are required by the integration tests that
# build a real validated chain.
pkix-path          = { workspace = true, features = ["p256", "std"] }
pkix-lint          = { workspace = true }
# pkix-profiles-cabf is a dev-only dep: the in-tree integration tests
# cross-validate the SC-081 cap math against the public-facing copy.
# Runtime dep flow is one-way: pkix-profiles-cabf -> pkix-lint-cabf.
# Path-only (no version) so `cargo package` / `cargo publish` strip it:
# with a version it forms a publish cycle, because pkix-profiles-cabf at
# the same version depends on this crate.
pkix-profiles-cabf = { path = "../pkix-profiles-cabf" }
x509-cert          = { workspace = true }
der                = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
