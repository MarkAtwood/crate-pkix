[package]
name        = "pkix-path-builder"
description = "RFC 4158 certification path building for pkix-path"
version               = "0.5.3"
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
repository.workspace  = true
authors.workspace     = true
keywords    = ["x509", "certificate", "pki", "pkix", "path-building"]
categories  = ["cryptography", "no-std"]

[features]
default = []
std     = ["der/std", "x509-cert/std"]
# Optional serde derives on the public `Error` type. Mirrors pkix-path's
# convention: typed inner errors so consumers can programmatically
# distinguish "no chain built" from "candidate chain rejected by
# validate_path". Pulled in by `pkix-chain/serde` (PKIX-zkjb.7).
# `pkix-path/serde` because Error::NoValidPath now carries a
# `pkix_path::Error`, whose Serialize/Deserialize impls live behind that
# crate's own serde feature. Without it, enabling serde here fails to
# compile rather than silently dropping the field.
serde = ["dep:serde", "pkix-path/serde"]

[dependencies]
pkix-path = { workspace = true }
der        = { workspace = true }
x509-cert  = { workspace = true }
serde      = { workspace = true, optional = true }

[dev-dependencies]
# `derive` for the test-only certificate mirror in tests/support/raw_cert.rs.
der = { workspace = true, features = ["derive"] }
pkix-path = { path = "../pkix-path", features = ["rsa", "p256", "std"] }
# Used by the `AlwaysRejectVerifier` in `tests/build_first_valid_path.rs` to
# spell out the `pkix_path::SignatureVerifier` trait's argument types (the
# error type is pkix-path's own `VerificationError`). spki is a transitive
# dep via pkix-path's public API; declared here only so the integration
# test's `impl SignatureVerifier` block can name the types.
spki      = { workspace = true }
# `pem` for `Certificate::load_pem_chain` in the BetterTLS fixture loaders
# (tests/bettertls.rs, tests/build_first_valid_path.rs); without it those
# targets only compile when another workspace member unifies the feature in.
x509-cert = { workspace = true, features = ["pem"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
