[package]
name        = "pkix-identity"
description = "Cert-side identity matching (RFC 6125 hostname, RFC 5280 §4.2.1.6 + RFC 8398 mailbox, IP literal)"
version               = "0.1.0"
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
repository.workspace  = true
authors.workspace     = true
keywords    = ["x509", "certificate", "pki", "rfc6125", "san"]
categories  = ["cryptography", "no-std"]

[features]
default = []
std     = ["x509-cert/std"]

[dependencies]
# Scaffold dependencies only. Implementation-time deps (`der`, `idna`) land
# in PKIX-fmtv.11 / .12 alongside the bodies that use them — declaring them
# now would trip `unused-crate-dependencies` lints in the scaffold build.
x509-cert = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
