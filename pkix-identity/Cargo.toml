[package]
name        = "pkix-identity"
description = "Cert-side identity matching (RFC 6125 hostname, RFC 5280 §4.2.1.6 + RFC 8398 mailbox, IP literal)"
version               = "0.3.3"
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
repository.workspace  = true
authors.workspace     = true
keywords    = ["x509", "certificate", "pki", "rfc6125", "san"]
categories  = ["cryptography", "no-std"]

[features]
default = []
# No `std` feature. After the Error impl moved to core::error::Error and the
# From<IpAddr> conversions to core::net, nothing in this crate was gated on
# it — the feature only forwarded `x509-cert/std` and `idna/std`, which a
# consumer who wants them can enable directly. One fewer knob, and the crate
# is now unconditionally no_std.

# Enable serde::Serialize / serde::Deserialize on the IdentityError type
# so it survives caching/transport when used inside pkix-chain::Error
# (AGENTS.md non-negotiable #6, PKIX-2l0v.1).
serde   = ["dep:serde"]

[dependencies]
# x509-cert exposes the Certificate / GeneralName types we walk.
x509-cert = { workspace = true }
# der gives us the OID constant + raw octet inspection for the SAN extension.
der       = { workspace = true }
# idna does the U-label ↔ A-label conversion required by RFC 6125 §6.4
# for internationalized DNS hostnames. Pinned no_std + alloc at the
# workspace level; we never need full `std` here.
idna      = { workspace = true }
serde     = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
