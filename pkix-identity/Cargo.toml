[package]
name        = "pkix-identity"
description = "Cert-side identity matching (RFC 6125 hostname, RFC 5280 §4.2.1.6 + RFC 8398 mailbox, IP literal)"
version               = "0.1.0"
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
repository.workspace  = true
authors.workspace     = true
keywords    = ["x509", "certificate", "pki", "rfc6125", "san"]
categories  = ["cryptography", "no-std"]

[features]
default = []
std     = ["x509-cert/std", "idna/std"]

[dependencies]
# x509-cert exposes the Certificate / GeneralName types we walk.
x509-cert = { workspace = true }
# der gives us the OID constant + raw octet inspection for the SAN extension.
der       = { workspace = true }
# idna does the U-label ↔ A-label conversion required by RFC 6125 §6.4
# for internationalized DNS hostnames. Pinned no_std + alloc at the
# workspace level; we never need full `std` here.
idna      = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
