[package]
name        = "pkix-chain"
description = "High-level X.509 certificate chain verification (pkix-path + pkix-revocation)"
version               = "0.9.0"
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
repository.workspace  = true
authors.workspace     = true
keywords    = ["x509", "certificate", "pki", "pkix", "chain"]
categories  = ["cryptography"]

[features]
# `dane` is DEFAULT-ON and pulls only pkix-dane: no_std, four small
# dependencies, no I/O and no network. The DANE-aware API surface is
# therefore present for every consumer.
#
# `dane-resolver` is OFF by default and pulls the DNS stack. Separating
# "DANE by default" from "DNS by default" is deliberate (PKIX-j32w.3):
# with the opportunistic failure policy an offline or firewalled caller
# would not break, but it would pay a failed lookup on EVERY
# verification, which a batch audit feels as hours. Offline consumers
# are untouched and, importantly, need no --no-default-features to stay
# that way.
default     = ["pkix-path/default", "dane"]
# `pkix-dane/smtp` comes with it: the RFC 7672 name checks and discovery
# live there, and pkix-chain already depends on pkix-identity for
# ServerName, so this adds no dependency. RFC 7672's CN-ID fallback stays
# behind its own function in pkix-identity, so nothing acquires it by
# enabling this.
dane        = ["dep:pkix-dane", "pkix-dane/smtp"]
dane-resolver = ["dane", "dep:pkix-dane-resolver"]

# MTA-STS (RFC 8461) combined with DANE. Implies `dane`, because the whole
# point of the combination is §2's rule that an MTA-STS result MUST NOT
# override a failing DANE validation — without a DANE verdict there is
# nothing to combine, and the precedence rule has no meaning.
mta-sts     = ["dane", "dep:pkix-mta-sts"]
rustcrypto  = ["pkix-path/rustcrypto"]
crl         = ["pkix-revocation/crl"]
ocsp        = ["pkix-revocation/ocsp"]

# Enable serde::Serialize / serde::Deserialize on the public Error type
# (AGENTS.md non-negotiable #6, PKIX-2l0v.1). Propagates through to
# the upstream Error variants and the pkix-identity::IdentityError
# variant carried by Error::Identity.
serde = [
    "dep:serde",
    "pkix-path/serde",
    "pkix-path-builder/serde",
    "pkix-revocation/serde",
    "pkix-identity/serde",
    "pkix-aia/serde",
    "pkix-dane?/serde",
]

[dependencies]
pkix-path       = { workspace = true, features = ["std"] }
pkix-revocation = { workspace = true, features = ["std"] }
pkix-identity   = { workspace = true }
pkix-profiles   = { workspace = true }
serde           = { workspace = true, optional = true }
# pkix-aia ships the AiaFetcher trait that `Verifier` is generic over
# (3rd generic with NoAiaFetcher default per PKIX-zkjb.9). When the
# caller-supplied chain is missing an intermediate, `Verifier` invokes
# the fetcher to retrieve candidate certs from `id-ad-caIssuers`
# AccessDescription URIs and feeds them to `pkix-path-builder` for
# reassembly. `NoAiaFetcher` short-circuits this path by returning
# `AiaError::FetchingDisabled`, preserving the historical "caller
# supplies the full chain" semantics. Real HTTP fetching lives in
# `pkix-aia-http`.
pkix-aia          = { workspace = true }

# TLSA record types and per-usage matching, behind the default-on `dane`
# feature. no_std with no I/O, which is what makes that default
# affordable.
# DaneError implements core::error::Error unconditionally, so Error::Dane
# can expose it through source() with no feature needed.
pkix-dane         = { workspace = true, optional = true }

# DNSSEC-validating resolution, behind `dane-resolver`. Pulls the DNS
# stack, which is why it is not default-on.
pkix-dane-resolver = { workspace = true, optional = true }
pkix-mta-sts       = { workspace = true, optional = true }
# pkix-path-builder provides the `CertPool` + `build_first_valid_path`
# entry points used to reassemble an incomplete chain from AIA-fetched
# intermediates (PKIX-zkjb.7). Note: pkix-path-builder is no_std-friendly
# by default; we pull the `std` feature so its consumers in this crate
# get `core::error::Error` impls on the error type.
pkix-path-builder = { workspace = true, features = ["std"] }
der               = { workspace = true }
# spki is used by `verify_responder_is_delegated_by` to call the
# `SignatureVerifier` directly with the supplied issuer's SPKI — the
# RFC 6960 §4.2.2.2 delegation check requires a cryptographic
# binding, not just DN equality (PKIX-q9hv.3).
spki              = { workspace = true }
x509-cert         = { workspace = true }

[dev-dependencies]
# Ad-hoc probe only (examples/real_world_probe.rs): loads the platform CA
# bundle so a real TLS chain can be validated end to end. Not a dependency
# of the library.
pkix-truststore = { workspace = true }
# Used by tests/serde_round_trip.rs (gated by required-features).
serde      = { workspace = true }
serde_json = { workspace = true }
# End-to-end AIA integration test (`tests/aia_http_e2e.rs`, PKIX-zkjb.8)
# drives `Verifier::verify_one` through `pkix-aia-http::HttpFetcher`
# against an in-process `mockito` HTTP server. pkix-aia-http is dev-only
# here — the runtime crate has no reason to bind to a specific HTTP
# transport.
pkix-aia-http = { workspace = true }

# tests/sans_io.rs drives the sans-I/O surface from an async task, to show
# that an async consumer needs no async trait from this crate. tokio is
# dev-only: pkix-chain itself knows nothing about runtimes.
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
mockito       = "1.7"

[[test]]
name = "serde_round_trip"
required-features = ["serde"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Ad-hoc probe: validates real TLS chains against the host CA bundle.
# Needs a signature backend. The requirement is declared rather than
# assumed, though it is now satisfied by default — pkix-path enables the
# whole RustCrypto set unless a caller turns it off.
[[example]]
name = "real_world_probe"
required-features = ["rustcrypto"]
